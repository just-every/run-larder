name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: foundation
            shard: 0
          - part: api
            shard: 0
          - part: browser-1
            shard: 1
          - part: browser-2
            shard: 2
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - name: Reclaim unused hosted runner toolchain space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          # rer dev, which the browser journey starts, requires 15 GiB free. This
          # JavaScript job does not use Android, .NET or Haskell.
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          reclaim_pids=()
          for reclaim_path in /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup; do
            sudo rm -rf -- "$reclaim_path" &
            reclaim_pids+=("$!")
          done
          reclaim_failed=0
          for reclaim_pid in "${reclaim_pids[@]}"; do
            wait "$reclaim_pid" || reclaim_failed=1
          done
          test "$reclaim_failed" -eq 0
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        # Technical foundation exports use composition.lock.json or reference-export.json.
        # Edition-owned seeds must commit both edition.json and sources.lock.json.
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - if: matrix.part != 'api'
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec rer check --profile first-party
      # The foundation partition still uses Base verify, including its hosted
      # production-output and hydration checks after the application target.
      - if: matrix.part == 'foundation'
        run: pnpm run verify
        env:
          LARDER_VERIFY_PART: foundation
      - if: matrix.part == 'api'
        run: pnpm run test:larder
      # Each partition starts its own real installation. No shared database or
      # parallel UI workers; together these partitions run every browser test.
      - if: startsWith(matrix.part, 'browser-')
        run: node tests/browser/run.mjs --shard=${{ matrix.shard }}/2
